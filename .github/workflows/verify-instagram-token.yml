name: Verify Instagram Token

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check token exists
        env:
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
        run: |
          echo "Length: ${#TOKEN}"

      - name: Verify Token
        env:
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
        run: |
          curl -s "https://graph.facebook.com/v23.0/me?access_token=$TOKEN"

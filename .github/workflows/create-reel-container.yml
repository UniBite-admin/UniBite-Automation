name: Create Instagram Reel Container

on:
  workflow_dispatch:

jobs:
  create-container:
    runs-on: ubuntu-latest

    steps:
      - name: Create Reel Container
        run: |
          curl -s -X POST \
          "https://graph.facebook.com/v23.0/${{ secrets.IG_USER_ID_EN }}/media" \
          -F "media_type=REELS" \
          -F "video_url=https://YOUR_VIDEO_URL_HERE" \
          -F "caption=🍔 UniBite Test Reel #foodfacts" \
          -F "access_token=${{ secrets.IG_ACCESS_TOKEN_EN }}"
